[package]
name = "code-auditor"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Code auditing with local or cloud models. CLI and TUI in one binary."
license = "MIT"
repository = "https://github.com/SpeedyCoder1192/code-auditor"
homepage = "https://github.com/SpeedyCoder1192/code-auditor"
readme = "README.md"
keywords = ["audit", "security", "llm", "ollama", "tui"]
categories = ["command-line-utilities", "development-tools"]
exclude = ["/demo", "dist-workspace.toml", "/packaging", "/.github", "action.yml", ".pre-commit-hooks.yaml"]

[[bin]]
name = "auditor"
path = "src/main.rs"

[dependencies]
anyhow = "1"
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
ratatui = "0.29"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs"] }
toml = "0.8"
walkdir = "2"

[profile.release]
lto = true
codegen-units = 1
strip = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
